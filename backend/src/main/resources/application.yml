server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: course-selection-v2
  jackson:
    time-zone: UTC
  sql:
    init:
      mode: never
app:
  mode: ${APP_MODE:serve}
  database:
    type: ${DB_TYPE:opengauss}
    url: ${DB_URL:jdbc:opengauss://127.0.0.1:26000/course_app_v2}
    user: ${DB_USER:course_v2_app}
    password: ${DB_PASSWORD:}
  init:
    confirm: ${INIT_CONFIRM:}
    runtime-role: ${APP_RUNTIME_ROLE:}
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    teacher-password: ${BOOTSTRAP_TEACHER_PASSWORD:}
    student-password: ${BOOTSTRAP_STUDENT_PASSWORD:}
  promotions:
    enabled: ${PROMOTIONS_ENABLED:true}
    delay-ms: 2000
logging:
  level:
    org.springframework.security: WARN
